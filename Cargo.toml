[package]
name = "picacho"
version = "0.1.0"
edition = "2024"
description = "Picacho: a fast, native email client for macOS, Windows, and Linux"
license = "MIT"
# mail-auth 0.14 and later need mail-parser 1.0, which needs Rust 1.98.
rust-version = "1.98"

[dependencies]
aes-gcm = "0.11"
anyhow = "1"
argon2 = "0.6"
base64 = "0.23"
# Embed Blitz without its standalone window/event loop or unrestricted network client.
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["system-fonts", "svg", "woff"] }
blitz-html = { version = "=0.3.0-beta.4", default-features = false }
blitz-paint = { version = "=0.3.0-beta.4", default-features = false, features = ["svg"] }
blitz-traits = "=0.3.0-beta.4"
anyrender = "0.14"
anyrender_vello_cpu = { version = "0.18", default-features = false }
peniko = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
bytemuck = "1"
chrono = { version = "0.4", features = ["serde"] }
cursor-icon = "1"
directories = "6"
# IMAP COMPRESS=DEFLATE (RFC 4978): raw deflate over the TLS stream.
flate2 = "1"
futures = "0.3"
data-url = "0.3"
keyboard-types = "0.8"
kurbo = "0.13"
gpui = "=0.2.2"
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
hkdf = "0.13"
# Tokio runs mail-auth's DNS lookups (hickory) for checking senders.
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
imap = "2.4"
# Parses responses that imap 2.4 cannot (CONDSTORE SELECT, Gmail ids); patched below.
imap-proto = "=0.10.2"
# Keyring 4's default features (its `v1` set, left on here) keep keyring 3's
# stores: Keychain, Credential Manager and the Secret Service, which finds
# items saved by keyring 3 by service and user.
keyring = "4"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls", "hostname"] }
# Checks DKIM, SPF and DMARC. Pure-Rust crypto, without aws-lc's C build.
mail-auth = { version = "0.15", default-features = false, features = ["rust-crypto", "dns-hickory"] }
# 0.17 and later limit MIME nesting; deeply nested parts used to overflow the stack.
mailparse = "0.18"
markdown = "1.0.0"
# Attachment content types from their file names.
mime_guess = "2"
native-tls = "0.2"
notify-rust = "4"
open = "5"
pgp = "0.21"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "form", "json", "native-tls"] }
# fallible_uint: sizes and counts bind as integers, failing rather than wrapping when too large.
rusqlite = { version = "0.42", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
unicode-normalization = "0.1"
url = "2"
# Removes tracking from links in mail; its rule catalog is in assets/url-sanitize.
url-sanitize-core = "2.4"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
rand08 = { package = "rand", version = "0.8" }
gpui = { version = "=0.2.2", features = ["test-support"] }

[features]
# Offers a fictional sample inbox from onboarding, for development and screenshots.
sample-data = []
# Offers Pinal Mail when adding an account. Off while Pinal's services are not
# public; existing Pinal accounts keep working either way.
pinal = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0

# The HTML reader parses, lays out and rasterizes on the CPU; unoptimized,
# one screen of an email takes ~50x longer. Optimize just those crates in
# development builds so debug runs reflect real reading speed.
# The UI framework lays out and paints the whole window on each frame;
# optimize it too, so debug builds show real frame cost.
[profile.dev.package.gpui]
opt-level = 2
[profile.dev.package.gpui-component]
opt-level = 2
[profile.dev.package.vello_cpu]
opt-level = 3
[profile.dev.package.vello_common]
opt-level = 3
[profile.dev.package.fearless_simd]
opt-level = 3
[profile.dev.package.anyrender]
opt-level = 3
[profile.dev.package.anyrender_vello_cpu]
opt-level = 3
[profile.dev.package."blitz-dom"]
opt-level = 3
[profile.dev.package."blitz-paint"]
opt-level = 3
[profile.dev.package."blitz-html"]
opt-level = 3
[profile.dev.package.html5ever]
opt-level = 3
[profile.dev.package.stylo]
opt-level = 3
[profile.dev.package.selectors]
opt-level = 3
[profile.dev.package.taffy]
opt-level = 3
[profile.dev.package.parley]
opt-level = 3
[profile.dev.package.parley_engine]
opt-level = 3
[profile.dev.package.harfrust]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package."read-fonts"]
opt-level = 3
[profile.dev.package.kurbo]
opt-level = 3
[profile.dev.package.peniko]
opt-level = 3
[profile.dev.package."tiny-skia-path"]
opt-level = 3
[profile.dev.package.usvg]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package."zune-jpeg"]
opt-level = 3
[profile.dev.package.glifo]
opt-level = 3
[profile.dev.package.color]
opt-level = 3
[profile.dev.package.cssparser]
opt-level = 3
[profile.dev.package.markup5ever]
opt-level = 3
[profile.dev.package.string_cache]
opt-level = 3
[profile.dev.package.tendril]
opt-level = 3
[profile.dev.package.fontique]
opt-level = 3
[profile.dev.package.fontdb]
opt-level = 3
[profile.dev.package.servo_arc]
opt-level = 3
[profile.dev.package.hashbrown]
opt-level = 3
[profile.dev.package.smallvec]
opt-level = 3
[profile.dev.package.bytemuck]
opt-level = 3
[profile.dev.package.icu_segmenter]
opt-level = 3
[profile.dev.package."unicode-bidi"]
opt-level = 3
[profile.dev.package.atomic_refcell]
opt-level = 3
[profile.dev.package.euclid]
opt-level = 3
[profile.dev.package.app_units]
opt-level = 3

[target.'cfg(target_os = "macos")'.dependencies]
# Debug builds only: the development driver captures the app's own window.
core-graphics = "0.24"
# Debug builds only: the development driver sends the window real mouse events.
objc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
# GPUI enables Fontconfig's dlopen API; select the matching API in Blitz's font backend.
fontique = { version = "0.12", features = ["fontconfig-dlopen"] }

[patch.crates-io]
# An email's unresolvable image or link address no longer panics; see the patch README.
blitz-dom = { path = "vendor/blitz-dom" }
# Inline boxes paint gradient backgrounds (emails' dark styles); see the patch README.
blitz-paint = { path = "vendor/blitz-paint" }
# ToCss error inference with GPUI's log/serde feature; see the patch README.
stylo_derive = { path = "vendor/stylo_derive" }
# Parses Gmail's X-GM-MSGID; see the patch README.
imap-proto = { path = "vendor/imap-proto" }
# Maximized windows' content is no longer a resize edge; see the patch README.
gpui-component = { path = "vendor/gpui-component" }
# Copying from a menu (a click) works on Wayland; see vendor/gpui/PATCHES.md.
gpui = { path = "vendor/gpui" }
